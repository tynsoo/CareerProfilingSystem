<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — CareerPath</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
</style>
</head>
<body class="min-h-screen">

<div class="relative flex items-center justify-center min-h-screen overflow-hidden">

  <!-- Background photo + triangle accents (matches login page) -->
  <div class="absolute inset-0">
    <img src="images/login/campus-bg.png" alt="" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-white/70"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[400px] pointer-events-none select-none" style="background:#081E3C; clip-path: polygon(0% 0%, 100% 100%, 0% 100%);"></div>
    <img src="images/login/red-triangle.svg" alt="" class="absolute bottom-0 right-0 w-[640px] pointer-events-none select-none">
  </div>

  <div class="relative w-full max-w-[448px] p-8">
    <div class="w-full bg-white border border-gray-100 rounded-xl shadow-2xl p-10 flex flex-col items-center gap-6">

      <!-- Icon + Heading -->
      <div class="flex flex-col items-center gap-1">
        <div class="w-16 h-16 rounded-xl bg-[#fbe2e3] flex items-center justify-center mb-3">
          <img src="images/login/icon-search-user.svg" alt="" class="w-7 h-6">
        </div>
        <h1 class="text-[#001c43] text-2xl font-semibold text-center">Forgot Your Password?</h1>
        <p class="text-gray-500 text-sm text-center max-w-[320px]">
          Enter your registered school email address. We'll send you a verification code to reset your password.
        </p>
      </div>

      <!-- Form -->
      <form action="reset-password.php" method="POST" class="w-full flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-[#001c43] text-xs font-semibold tracking-wide">EMAIL ADDRESS</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-3.5">
              <img src="images/login/icon-mail.svg" alt="" class="w-full h-full">
            </span>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="Enter school email address"
              required
              class="w-full pl-10 pr-4 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
          </div>
        </div>

        <button type="submit" class="w-full flex items-center justify-center gap-2 py-3.5 rounded-md bg-[#ed1c24] text-white text-xs font-semibold tracking-wide uppercase shadow hover:opacity-90 transition">
          Send Verification Code
          <img src="images/login/icon-arrow-right.svg" alt="" class="w-3.5 h-3">
        </button>
      </form>

      <!-- Back to login -->
      <div class="flex flex-col items-center gap-2">
        <p class="text-gray-500 text-xs">Remember your password?</p>
        <a href="login.html" class="flex items-center gap-1 text-[#ed1c24] text-xs font-semibold">
          <img src="images/login/icon-arrow-left.svg" alt="" class="w-3 h-3">
          Back to Login
        </a>
      </div>
    </div>

    <!-- Security note -->
    <p class="text-gray-500 text-xs text-center italic mt-6">
      For additional security assistance, contact the IT Helpdesk at helpdesk@mapua.edu.ph
    </p>
  </div>

</div>

</body>
</html>
