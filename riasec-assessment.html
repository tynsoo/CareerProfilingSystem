<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIASEC Assessment — Career Profiling System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'League Spartan', sans-serif; }
</style>
</head>
<body class="bg-[#edf0f6] min-h-screen">

<!-- Header -->
<header class="bg-[#091b47] h-[82px] flex items-center px-6 gap-6 sticky top-0 z-10">
  <button type="button" id="backBtn" class="w-[42px] h-[33px] shrink-0 flex items-center justify-center text-white">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <h1 class="text-white text-[28px] md:text-[32px] font-semibold tracking-wide">Assessment</h1>
  <div class="flex-1"></div>
  <p class="text-white text-lg md:text-xl font-light" id="headerName">Student</p>
  <span class="inline-flex items-center bg-[#8a9bc2]/50 border border-white rounded-full px-5 py-2 text-white text-base md:text-lg font-light whitespace-nowrap" id="headerGrade">—</span>
</header>

<main class="max-w-[1440px] mx-auto px-6 md:px-10 py-8">

  <!-- Dimension Tabs -->
  <div id="dimensionTabs" class="flex flex-wrap gap-3 mb-6"></div>

  <!-- Overall Progress -->
  <div class="bg-white border border-black/[0.08] rounded-[13px] px-6 py-4 mb-6 flex items-center gap-4">
    <span class="text-base md:text-lg font-medium text-black shrink-0">Overall Progress</span>
    <div class="flex-1 h-2.5 rounded-full bg-slate-200 overflow-hidden">
      <div id="overallProgressBar" class="h-full rounded-full bg-[#091b47] transition-all duration-300" style="width:0%"></div>
    </div>
    <span class="text-base md:text-lg font-medium text-black shrink-0" id="overallProgressText">1/60</span>
  </div>

  <!-- Question Card -->
  <div class="bg-white border border-black/[0.08] rounded-[13px] p-8 md:p-10 min-h-[480px] flex flex-col">
    <p class="text-[#5c5a5a] text-base md:text-lg font-medium mb-3" id="questionMeta">Realistic - Question 1 out of 10</p>
    <h2 class="text-black text-2xl md:text-[32px] font-medium mb-8" id="questionText">—</h2>

    <div id="optionsList" class="flex flex-col gap-4 max-w-[1175px] mx-auto w-full"></div>

    <div class="flex-1"></div>
    <div class="flex justify-end pt-8">
      <button type="button" id="nextBtn" disabled class="flex items-center gap-2 rounded-[15px] px-8 py-3.5 text-lg md:text-xl font-medium border border-black/[0.15] bg-white text-[#5c5a5a] cursor-not-allowed transition-colors">
        <span id="nextBtnLabel">Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

</main>

<!-- Exit confirmation modal -->
<div id="exitModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6 flex flex-col gap-4">
    <h3 class="text-lg font-semibold text-black">Leave the assessment?</h3>
    <p class="text-sm text-[#5c5a5a]">Your progress is saved, so you can pick up right where you left off next time.</p>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" id="exitCancel" class="px-4 py-2 text-sm font-medium text-[#5c5a5a] border border-black/[0.15] rounded-md hover:bg-slate-50">Stay</button>
      <button type="button" id="exitConfirm" class="px-4 py-2 text-sm font-medium text-white bg-[#091b47] rounded-md hover:opacity-90">Leave</button>
    </div>
  </div>
</div>

<script>
(function() {
  const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
  if (!currentUser || currentUser.role !== 'student') {
    window.location.replace('login.html');
    return;
  }

  document.getElementById('headerName').textContent = currentUser.firstName + ' ' + currentUser.lastName;
  document.getElementById('headerGrade').textContent = 'Grade ' + currentUser.gradeLevel + ' - ' + currentUser.strand;

  const DIMENSIONS = [
    { code: 'R', label: 'Realistic' },
    { code: 'I', label: 'Investigate' },
    { code: 'A', label: 'Artistic' },
    { code: 'S', label: 'Social' },
    { code: 'E', label: 'Enterprising' },
    { code: 'C', label: 'Conventional' }
  ];

  const QUESTION_BANK = {
    R: [
      'I enjoy repairing broken equipment.',
      'I like working with tools and machinery.',
      'I enjoy building or assembling things.',
      'I prefer practical tasks over theoretical discussions.',
      'I like working outdoors.',
      'I enjoy operating vehicles or heavy equipment.',
      'I am interested in construction projects.',
      'I enjoy fixing electrical or mechanical problems.',
      'I like working with plants, animals, or natural resources.',
      'I prefer physical activities to office work.'
    ],
    I: [
      'I enjoy solving complex problems.',
      'I like conducting experiments.',
      'I enjoy learning about scientific discoveries.',
      'I like analyzing information before making decisions.',
      'I enjoy researching topics in depth.',
      'I like finding patterns in data.',
      'I enjoy mathematics and logical reasoning.',
      'I am curious about how things work.',
      'I enjoy investigating causes of problems.',
      'I like studying subjects that require critical thinking.'
    ],
    A: [
      'I enjoy drawing, painting, or designing.',
      'I like expressing myself creatively.',
      'I enjoy writing stories, poems, or articles.',
      'I like creating original ideas.',
      'I enjoy performing music, dance, or theater.',
      'I prefer flexible environments over strict rules.',
      'I enjoy designing visual materials.',
      'I like exploring different forms of art.',
      'I enjoy imaginative activities.',
      'I prefer creative projects to routine tasks.'
    ],
    S: [
      'I enjoy helping people solve their problems.',
      'I like teaching others new skills.',
      'I enjoy working in teams.',
      'I like volunteering for community activities.',
      "I enjoy listening to people's concerns.",
      'I am interested in counseling or mentoring others.',
      'I enjoy caring for people.',
      'I like participating in group discussions.',
      'I enjoy motivating others.',
      'I prefer jobs that involve interacting with people.'
    ],
    E: [
      'I enjoy leading a group.',
      'I like convincing others to support my ideas.',
      'I enjoy organizing projects and events.',
      'I like taking initiative in group situations.',
      'I enjoy setting goals and achieving them.',
      'I am interested in starting a business.',
      'I enjoy making decisions for a team.',
      'I like negotiating with others.',
      'I enjoy selling products or services.',
      'I am comfortable taking risks to achieve success.'
    ],
    C: [
      'I enjoy organizing files and records.',
      'I like following established procedures.',
      'I enjoy working with numbers and data.',
      'I prefer clear instructions when completing tasks.',
      'I enjoy planning schedules and timelines.',
      'I like maintaining accurate records.',
      'I enjoy administrative or office work.',
      'I pay attention to details.',
      'I enjoy tasks that require precision.',
      'I prefer structured environments over unpredictable ones.'
    ]
  };

  const OPTIONS = ['Dislike', 'Slightly Dislike', 'Neutral', 'Slightly Enjoy', 'Enjoy'];

  const QUESTIONS = [];
  DIMENSIONS.forEach(function(dim) {
    QUESTION_BANK[dim.code].forEach(function(text, i) {
      QUESTIONS.push({ dimension: dim.code, label: dim.label, indexInDim: i + 1, text: text });
    });
  });
  const TOTAL = QUESTIONS.length;

  const PROGRESS_KEY = 'assessmentProgress_' + currentUser.schoolId;
  const STATUS_KEY = 'assessmentStatus_' + currentUser.schoolId;

  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
      if (saved && Array.isArray(saved.answers) && saved.answers.length === TOTAL) return saved;
    } catch (e) {}
    return { answers: new Array(TOTAL).fill(null) };
  }
  function saveProgress(state) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
  }

  const state = loadProgress();
  let currentIndex = state.answers.findIndex(function(a) { return a === null; });
  if (currentIndex === -1) currentIndex = TOTAL - 1;

  function renderTabs() {
    const wrap = document.getElementById('dimensionTabs');
    wrap.innerHTML = DIMENSIONS.map(function(dim) {
      const active = dim.code === QUESTIONS[currentIndex].dimension;
      const cls = active
        ? 'bg-[#091b47] text-white'
        : 'bg-white text-black border border-black/[0.15]';
      return '<span class="' + cls + ' rounded-full px-6 py-3 text-lg md:text-xl font-medium whitespace-nowrap">' + dim.label + '</span>';
    }).join('');
  }

  function renderOptions() {
    const list = document.getElementById('optionsList');
    const selected = state.answers[currentIndex];
    list.innerHTML = OPTIONS.map(function(label, i) {
      const value = i + 1;
      const isSelected = selected === value;
      const rowCls = isSelected
        ? 'bg-[#e7ecfa] border-[#091b47]'
        : 'bg-[#f1f4fc] border-black/[0.08] hover:border-black/[0.2]';
      const dotCls = isSelected ? 'border-[#091b47]' : 'border-black/40';
      const dotInner = isSelected ? '<span class="w-2.5 h-2.5 rounded-full bg-[#091b47]"></span>' : '';
      return '<button type="button" data-value="' + value + '" class="option-row flex items-center gap-4 border rounded-[13px] h-14 px-5 text-left text-lg md:text-xl text-black transition-colors ' + rowCls + '">' +
        '<span class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ' + dotCls + '">' + dotInner + '</span>' +
        label +
        '</button>';
    }).join('');

    list.querySelectorAll('.option-row').forEach(function(btn) {
      btn.addEventListener('click', function() {
        state.answers[currentIndex] = parseInt(btn.dataset.value, 10);
        saveProgress(state);
        renderOptions();
        updateNextButton();
      });
    });
  }

  function updateNextButton() {
    const btn = document.getElementById('nextBtn');
    const answered = state.answers[currentIndex] !== null;
    btn.disabled = !answered;
    if (answered) {
      btn.className = 'flex items-center gap-2 rounded-[15px] px-8 py-3.5 text-lg md:text-xl font-medium border border-[#091b47] bg-[#091b47] text-white transition-colors hover:opacity-90';
    } else {
      btn.className = 'flex items-center gap-2 rounded-[15px] px-8 py-3.5 text-lg md:text-xl font-medium border border-black/[0.15] bg-white text-[#5c5a5a] cursor-not-allowed transition-colors';
    }
    document.getElementById('nextBtnLabel').textContent = currentIndex === TOTAL - 1 ? 'Finish' : 'Next';
  }

  function renderQuestion() {
    const q = QUESTIONS[currentIndex];
    document.getElementById('questionMeta').textContent = q.label + ' - Question ' + q.indexInDim + ' out of 10';
    document.getElementById('questionText').textContent = q.text;
    document.getElementById('overallProgressText').textContent = (currentIndex + 1) + '/' + TOTAL;
    document.getElementById('overallProgressBar').style.width = ((currentIndex) / TOTAL * 100) + '%';
    renderTabs();
    renderOptions();
    updateNextButton();
  }

  function computeResults() {
    const totals = { R: 0, I: 0, A: 0, S: 0, E: 0, C: 0 };
    QUESTIONS.forEach(function(q, i) {
      totals[q.dimension] += state.answers[i] || 0;
    });
    const ranked = DIMENSIONS
      .map(function(d) { return { code: d.code, label: d.label, score: totals[d.code] }; })
      .sort(function(a, b) { return b.score - a.score; });
    return { totals: totals, ranked: ranked };
  }

  document.getElementById('nextBtn').addEventListener('click', function() {
    if (state.answers[currentIndex] === null) return;

    if (currentIndex === TOTAL - 1) {
      const results = computeResults();
      localStorage.setItem(STATUS_KEY, JSON.stringify({
        completed: true,
        completedAt: new Date().toISOString(),
        scores: results.totals,
        topTypes: results.ranked.slice(0, 3).map(function(r) { return r.label; }),
        careers: []
      }));
      localStorage.removeItem(PROGRESS_KEY);
      window.location.href = 'results.html';
      return;
    }

    currentIndex++;
    saveProgress(state);
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  const exitModal = document.getElementById('exitModal');
  document.getElementById('backBtn').addEventListener('click', function() {
    exitModal.classList.remove('hidden');
  });
  document.getElementById('exitCancel').addEventListener('click', function() {
    exitModal.classList.add('hidden');
  });
  document.getElementById('exitConfirm').addEventListener('click', function() {
    window.location.href = 'assessment.html';
  });
  exitModal.addEventListener('click', function(e) {
    if (e.target.id === 'exitModal') exitModal.classList.add('hidden');
  });

  renderQuestion();
})();
</script>

</body>
</html>
