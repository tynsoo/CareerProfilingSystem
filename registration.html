<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Career Profiling System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
  select{ appearance:none; -webkit-appearance:none; }
</style>
<link rel="stylesheet" href="css/motion.css">
</head>
<body class="min-h-screen">

<div class="relative flex flex-col items-start justify-center min-h-screen overflow-hidden">

  <!-- Background photo + triangle accents (matches login page) -->
  <div class="absolute inset-0">
    <img src="images/login/campus-bg.png" alt="" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-white/70"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[400px] pointer-events-none select-none" style="background:#081E3C; clip-path: polygon(0% 0%, 100% 100%, 0% 100%);"></div>
    <img src="images/login/red-triangle.svg" alt="" class="absolute bottom-0 right-0 w-[640px] pointer-events-none select-none">
  </div>

  <div class="relative flex w-full min-h-screen">

    <!-- Left: Branding -->
    <div class="hidden md:flex flex-1 relative overflow-hidden">
      <div class="relative m-auto max-w-md px-8" data-reveal="left">
        <img src="images/login/cgc-logo-title.png" alt="Center for Guidance and Counseling — Mapúa MCL" class="w-[280px] mb-4">
        <h1 class="text-[#001c43] text-3xl font-medium leading-tight">Career Profiling System</h1>
        <div class="w-16 h-1 bg-[#ed1c24] mt-4 mb-4"></div>
        <p class="text-[#001c43] text-lg leading-relaxed">
          Empowering students. Guiding futures.
          Data-driven insights for informed career decisions.
        </p>
      </div>
    </div>

    <!-- Right: Registration Card -->
    <div class="flex flex-1 items-center justify-center p-8 py-12">
      <div class="w-full max-w-[520px] bg-white border border-gray-100 rounded-xl shadow-2xl p-10 flex flex-col gap-6" data-reveal="scale" style="transition-delay:120ms">

        <!-- Header -->
        <div class="flex flex-col items-center gap-1">
          <img src="images/login/mmcl-crest.png" alt="Mapúa MCL crest" class="w-[140px] mb-2">
          <h2 class="text-[#001c43] text-2xl font-bold text-center">Create Your Account</h2>
          <p class="text-gray-500 text-sm text-center">
            Sign up to get started with <span class="text-[#ed1c24] font-semibold">Career Profiling System</span>.
          </p>
        </div>

        <!-- Form -->
        <form id="registerForm" class="flex flex-col gap-5">

          <p id="formMessage" class="hidden text-sm rounded-md px-3.5 py-2.5"></p>

          <div class="grid grid-cols-2 gap-4">
            <input
              type="text"
              name="first_name"
              placeholder="First Name"
              required
              class="w-full px-3.5 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
            <input
              type="text"
              name="last_name"
              placeholder="Last Name"
              required
              class="w-full px-3.5 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
          </div>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-4">
              <img src="images/login/icon-user.svg" alt="" class="w-full h-full">
            </span>
            <input
              type="text"
              name="school_id"
              placeholder="School ID"
              required
              class="w-full pl-10 pr-3 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
          </div>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-4">
              <img src="images/login/icon-mail.svg" alt="" class="w-full h-full">
            </span>
            <input
              type="email"
              name="email"
              placeholder="Email Address"
              required
              class="w-full pl-10 pr-3 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
          </div>

          <div class="grid grid-cols-2 gap-4 items-start">
            <div class="relative">
              <select
                name="strand"
                required
                class="w-full px-3.5 py-3.5 border border-gray-300 rounded-md text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent bg-white">
                <option value="">Select Strand</option>
                <option value="STEM">STEM</option>
                <option value="ABM">ABM</option>
                <option value="HUMSS">HUMSS</option>
                <option value="GAS">GAS</option>
                <option value="TVL">TVL</option>
              </select>
              <img src="images/login/icon-arrow-right.svg" alt="" class="absolute right-4 top-1/2 -translate-y-1/2 w-2.5 h-2.5 rotate-90 pointer-events-none opacity-50">
            </div>

            <div class="flex gap-2 h-[52px]">
              <input type="radio" id="grade11" name="grade_level" value="11" required class="hidden peer/g11">
              <label for="grade11" class="grade-btn flex-1 flex items-center justify-center border border-gray-300 rounded-md text-sm text-gray-600 cursor-pointer peer-checked/g11:bg-[#ed1c24] peer-checked/g11:text-white peer-checked/g11:border-[#ed1c24] font-medium">Grade 11</label>
              <input type="radio" id="grade12" name="grade_level" value="12" class="hidden peer/g12">
              <label for="grade12" class="grade-btn flex-1 flex items-center justify-center border border-gray-300 rounded-md text-sm text-gray-600 cursor-pointer peer-checked/g12:bg-[#ed1c24] peer-checked/g12:text-white peer-checked/g12:border-[#ed1c24] font-medium">Grade 12</label>
            </div>
          </div>

          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-4">
              <img src="images/login/icon-lock.svg" alt="" class="w-full h-full">
            </span>
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Password"
              required
              class="w-full pl-10 pr-10 py-3.5 border border-gray-300 rounded-md text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#ed1c24] focus:border-transparent">
            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-4">
              <img src="images/login/icon-eye.svg" alt="Toggle password visibility" class="w-full h-full">
            </button>
          </div>

          <button type="submit" class="w-full py-3.5 rounded-md bg-[#ed1c24] text-white text-sm font-medium shadow hover:opacity-90 transition">
            Create Account
          </button>
        </form>

        <!-- Footer -->
        <p class="text-sm text-gray-500 text-center">
          Already have an account? <a href="login.html" class="text-[#ed1c24] font-semibold hover:underline">Sign in</a>
        </p>

      </div>
    </div>

  </div>
</div>

<script>
  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  (function() {
    function showMessage(text, isError) {
      const msg = document.getElementById('formMessage');
      msg.textContent = text;
      msg.className = 'text-sm rounded-md px-3.5 py-2.5 ' + (isError
        ? 'text-[#ed1c24] bg-red-50 border border-red-100'
        : 'text-green-700 bg-green-50 border border-green-100');
      void msg.offsetWidth;
      msg.classList.add('alert-anim');
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const firstName = form.first_name.value.trim();
      const lastName = form.last_name.value.trim();
      const schoolId = form.school_id.value.trim();
      const email = form.email.value.trim();
      const strand = form.strand.value;
      const gradeLevel = form.querySelector('input[name="grade_level"]:checked');
      const password = form.password.value;

      if (!firstName || !lastName || !schoolId || !email || !strand || !gradeLevel || !password) {
        showMessage('Please fill out all fields.', true);
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        const res = await fetch('api/register.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName, lastName, schoolId, email, strand,
            gradeLevel: gradeLevel.value,
            password
          })
        });
        const data = await res.json();

        if (!data.success) {
          showMessage(data.error || 'Registration failed. Please try again.', true);
          return;
        }

        showMessage('Account created! Redirecting to login...', false);
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 900);
      } catch (err) {
        showMessage('Unable to reach the server. Please try again.', true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  })();
</script>

<script src="js/motion.js" defer></script>
</body>
</html>
