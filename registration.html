<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="register-container">

    <img src="images/MMCL-logo.webp"
         alt="MMCL Logo"
         class="register-logo">

    <div class="register-card">

        <h2>Create Account</h2>

        <p id="formMessage" class="form-message" style="display:none;"></p>

        <form id="registerForm" action="register.php" method="POST">

            <div class="name-row">
                <input type="text"
                       name="first_name"
                       placeholder="First Name"
                       required>

                <input type="text"
                       name="last_name"
                       placeholder="Last Name"
                       required>
            </div>

            <input type="text"
                   name="school_id"
                   placeholder="School ID"
                   required>

            <div class="row">

                <div class="strand-section">
                    <label>SHS Strand</label>

                    <select name="strand" required>
                        <option value="">Select Strand</option>
                        <option value="STEM">STEM</option>
                        <option value="ABM">ABM</option>
                        <option value="HUMSS">HUMSS</option>
                        <option value="GAS">GAS</option>
                        <option value="TVL">TVL</option>
                    </select>
                </div>

                <div class="grade-section">

                    <label>Grade Level</label>

                    <div class="grade-buttons">

                        <input type="radio"
                               id="grade11"
                               name="grade_level"
                               value="11"
                               required>

                        <label for="grade11"
                               class="grade-btn">
                            Grade 11
                        </label>

                        <input type="radio"
                               id="grade12"
                               name="grade_level"
                               value="12">

                        <label for="grade12"
                               class="grade-btn">
                            Grade 12
                        </label>

                    </div>

                </div>

            </div>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

</div>

<script>
  (function() {
    const STORAGE_KEY = 'studentAccounts';

    function loadAccounts() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
    }
    function saveAccounts(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }
    function showMessage(text, isError) {
      const msg = document.getElementById('formMessage');
      msg.textContent = text;
      msg.style.display = 'block';
      msg.style.color = isError ? '#ffb3b3' : '#b6f0c2';
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const firstName = form.first_name.value.trim();
      const lastName = form.last_name.value.trim();
      const schoolId = form.school_id.value.trim();
      const strand = form.strand.value;
      const gradeLevel = form.querySelector('input[name="grade_level"]:checked');
      const password = form.password.value;

      if (!firstName || !lastName || !schoolId || !strand || !gradeLevel || !password) {
        showMessage('Please fill out all fields.', true);
        return;
      }

      const accounts = loadAccounts();
      if (accounts.some(a => a.schoolId.toLowerCase() === schoolId.toLowerCase())) {
        showMessage('An account with this School ID already exists.', true);
        return;
      }

      accounts.push({
        schoolId: schoolId,
        firstName: firstName,
        lastName: lastName,
        strand: strand,
        gradeLevel: gradeLevel.value,
        password: password,
        registeredAt: new Date().toISOString()
      });
      saveAccounts(accounts);

      showMessage('Account created! Redirecting to login...', false);
      setTimeout(function() {
        window.location.href = 'login.html';
      }, 900);
    });
  })();
</script>

</body>
</html>
