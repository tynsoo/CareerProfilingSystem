<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/csrf.js"></script><script src="js/ui-state.js"></script>
<title>Counseling Requests — Career Profiling System</title>
<link rel="icon" type="image/png" href="images/brand/favicon-64.png">
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
</style>
<link rel="stylesheet" href="css/motion.css">
</head>
<body class="bg-[#f9fafb]">
<a href="#main-content" class="skip-link">Skip to main content</a>

<div class="flex min-h-screen">

  <!-- Mobile sidebar backdrop -->
  <div id="sidebarBackdrop" class="hidden fixed inset-0 bg-black/40 z-30 md:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="w-[260px] shrink-0 bg-[#001c43] flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full transition-transform duration-200 md:sticky md:top-0 md:translate-x-0 h-screen">
    <div class="sidebar-brand bg-white shrink-0">
      <img src="images/MMCL-logo.webp" alt="Mapúa Malayan Colleges Laguna" class="sidebar-brand-mmcl">
      <img src="images/login/cgc-logo-title.png" alt="Center for Guidance and Counseling" class="sidebar-brand-cgc">
    </div>
    <div class="sidebar-app">
      <img src="images/brand/profilepath-horizontal.png" alt="ProfilePath" width="190" height="75">
      <p class="sidebar-app-role">Admin Dashboard</p>
    </div>
    <nav id="adminNav" data-active="counseling-requests" class="flex-1 flex flex-col gap-0.5 py-2 overflow-auto"></nav>
    <script src="js/admin-nav.js"></script>
    <div class="border-t border-white/5 pt-[25px] pb-6">
      <a href="staff-login" id="sidebarLogout" class="flex items-center gap-3.5 h-[50px] pl-6 rounded-r-lg border-l-[3px] border-transparent text-white/85 text-sm hover:bg-white/5">
        <svg class="w-4 h-4 shrink-0" viewBox="0 -960 960 960" fill="currentColor"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/></svg>
        Log out
      </a>
    </div>

  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 flex items-center justify-between px-6 h-16 shrink-0 relative">
      <button type="button" id="menuToggle" class="relative z-50 w-10 h-10 -m-2.5 flex items-center justify-center md:invisible">
        <img src="images/admin/icon-menu.svg" alt="Menu" class="w-5 h-4">
      </button>
      <div class="flex items-center gap-6">

        <div id="ayBadge" class="hidden sm:flex items-center gap-1.5 bg-slate-100 border border-slate-200 rounded-full px-3 py-1">
          <span class="text-[10px] font-semibold tracking-wide text-slate-500 uppercase">AY</span>
          <span id="ayBadgeValue" class="text-xs font-semibold text-slate-700">—</span>
        </div>

        <!-- Notifications -->
        <div class="relative">
          <button type="button" id="notifBtn" data-shared-toggle class="relative w-5 h-5">
            <svg class="w-full h-full" viewBox="0 -960 960 960" fill="#64748B"><path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/></svg>
            <span id="notifBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#ed1c24] text-white text-[10px] font-bold flex items-center justify-center"></span>
          </button>
          <div id="notifPanel" class="hidden fixed left-4 right-4 top-[76px] z-50 sm:absolute sm:left-auto sm:right-0 sm:top-[calc(100%+12px)] sm:w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
              <p class="text-sm font-semibold text-gray-900">Notifications</p>
              <span id="notifCountLabel" class="text-xs text-gray-500">Loading…</span>
            </div>
            <ul id="notifList" class="max-h-80 overflow-auto divide-y divide-gray-100">
              <li class="px-4 py-6 text-center text-sm text-gray-500">Loading…</li>
            </ul>
            <a href="staff-notifications" class="block text-center text-sm font-medium text-[#ed1c24] px-4 py-3 border-t border-gray-100 hover:bg-gray-50">View all notifications</a>
          </div>
        </div>

        <!-- Profile -->
        <div class="relative">
          <button type="button" id="profileBtn" class="flex items-center gap-3">
            <span id="headerAvatarWrap" class="w-9 h-9 rounded-full bg-[#001c43] flex items-center justify-center overflow-hidden shrink-0">
              <img src="images/admin/icon-avatar.svg" alt="" class="w-3.5 h-4">
            </span>
            <span class="text-left">
              <span class="block text-sm font-semibold text-gray-800" id="headerUserName">&nbsp;</span>
              <span class="block text-xs text-gray-500" id="headerUserRole">&nbsp;</span>
            </span>
            <img src="images/admin/icon-chevron-down.svg" alt="" class="w-3.5 h-2">
          </button>
          <div id="profilePanel" class="hidden absolute right-0 top-[calc(100%+12px)] w-56 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden z-20">
            <a href="staff-profile" class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50">Profile Settings</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main id="main-content" class="flex-1 p-4 sm:p-8 overflow-auto">

      <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Counseling Requests</h1>
          <p class="text-sm text-slate-500 mt-1">Messages students have sent to the Guidance Office.</p>
        </div>
        <div class="flex items-center gap-2" id="statusTabs">
        </div>
      </div>

      <div class="flex items-center gap-2 mb-4" id="viewTabs">
        <button type="button" data-view="counseling" aria-pressed="false" class="view-tab pp-filter-tab">Counseling Requests</button>
        <button type="button" data-view="retakes" aria-pressed="false" class="view-tab pp-filter-tab">Retake Requests <span id="retakeCount"></span></button>
      </div>

      <div class="flex flex-col gap-4" id="requestsList">
        <p class="text-sm text-slate-500 text-center py-8">Loading…</p>
      </div>


    </main>

      <footer class="shrink-0 bg-white border-t border-gray-100 px-6 py-3 flex items-center justify-center gap-3 text-xs text-gray-500">
        <a href="terms" class="hover:text-gray-600 hover:underline">Terms of Use</a>
        <span>&middot;</span>
        <a href="privacy" class="hover:text-gray-600 hover:underline">Data Privacy</a>
        <span>&middot;</span>
        <a href="accessibility" class="hover:text-gray-600 hover:underline">Accessibility</a>
      </footer>
  </div>
</div>

<script>
(async function() {
  const sessionData = await (await fetch('api/session.php')).json();
  const currentUser = sessionData.user;
  if (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'counselor')) {
    window.location.replace('staff-login');
    return;
  }

  const headerAvatarWrap = document.getElementById('headerAvatarWrap');
  if (currentUser.avatarUrl) {
    headerAvatarWrap.innerHTML = `<img src="${currentUser.avatarUrl}" alt="" class="w-full h-full object-cover">`;
  }
  const roleLabels = { admin: 'Administrator', counselor: 'Guidance Counselor' };
  document.getElementById('headerUserName').textContent = currentUser.displayName || currentUser.username;
  document.getElementById('headerUserRole').textContent = currentUser.positionLabel || roleLabels[currentUser.role] || currentUser.role;

  document.getElementById('sidebarLogout').addEventListener('click', function(e) { e.preventDefault(); PP.logout('staff-login'); });

  (function() {
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const backdrop = document.getElementById('sidebarBackdrop');
    function openSidebar() { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); menuToggle.classList.add('invisible'); }
    function closeSidebar() { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); menuToggle.classList.remove('invisible'); }
    menuToggle.addEventListener('click', () => {
      sidebar.classList.contains('-translate-x-full') ? openSidebar() : closeSidebar();
    });
    backdrop.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });
  })();

  (function() {
    const profileBtn = document.getElementById('profileBtn');
    const profilePanel = document.getElementById('profilePanel');
    profileBtn.addEventListener('click', (e) => { e.stopPropagation(); profilePanel.classList.toggle('hidden'); });
    document.addEventListener('click', () => profilePanel.classList.add('hidden'));
  })();

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
      new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  // Office days from the day it was sent until today: each later day counts, except Sundays.
  function officeDaysSince(iso) {
    const day = new Date(iso);
    day.setHours(0, 0, 0, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let count = 0;
    while (day < today) {
      day.setDate(day.getDate() + 1);
      if (day.getDay() !== 0) count++;
    }
    return count;
  }

  // Invite to counseling: sends the student the CGC booking link by email and as a notification. Counseling belongs to the
  // Guidance Counselors and the Head of Guidance (the Counseling Notes permission), so the button only shows for them.
  let canInvite = currentUser.role === 'admin';
  try {
    const inviteCfg = await (await fetch('api/security-config.php')).json();
    canInvite = ((inviteCfg.rbac && inviteCfg.rbac.counselingStatus && inviteCfg.rbac.counselingStatus[currentUser.rbacRole || currentUser.role]) || 'none') === 'full' && (currentUser.rbacRole || currentUser.role) !== 'facilitator'; // Facilitators never invite or decide retakes (DFD process 4.0)
  } catch (e) {}
  async function sendCounselingInvite(studentId) {
    const res = await fetch('api/counseling-invite.php', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentId: Number(studentId) })
    });
    const data = await res.json();
    if (!data.success) return { ok: false, text: data.error || 'Could not send the invitation.' };
    return data.emailSent
      ? { ok: true, text: 'Invitation sent by email and notification.' }
      : { ok: false, text: 'Notification sent. The email could not be sent' + (data.hasEmail ? '.' : ' because this student has no verified email.') };
  }
  function showToast(text, isError) {
    const el = document.createElement('div');
    el.className = 'fixed bottom-4 right-4 z-[60] max-w-sm px-4 py-3 rounded-lg shadow-lg text-sm font-medium whitespace-pre-wrap ' + (isError ? 'bg-[#ed1c24] text-white' : 'bg-green-600 text-white');
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 6000);
  }

  // The view (?tab=retakes) and each view's status tab live in the page address, so Reload and Back show the same
  // list (PP.listState in js/ui-state.js). ?tab=retakes keeps working for links from other pages.
  const listState = PP.listState({ tab: 'counseling', status: 'open', retake: 'pending' }, []);
  const saved = listState.read();
  let view = saved.tab === 'retakes' ? 'retakes' : 'counseling';
  let activeStatus = ['open', 'resolved', 'all'].includes(saved.status) ? saved.status : 'open';
  let retakeStatus = ['pending', 'approved', 'declined', 'completed', 'all'].includes(saved.retake) ? saved.retake : 'pending';
  function saveState() { listState.save({ tab: view, status: activeStatus, retake: retakeStatus }); }
  const getList = PP.latestJson(); // a new tab click cancels the list still on its way

  function renderCard(r) {
    // Badge colors by meaning (PP.badge in js/ui-state.js): an open request is waiting (amber), not an error.
    const statusBadge = r.status === 'open'
      ? PP.badge('Open — #' + r.queueNumber + ' in queue', 'amber')
      : PP.badge('Resolved', 'green');
    // Resolving needs Full on Update counseling status (canInvite holds that level, see above).
    const resolveBtn = r.status === 'open' && canInvite
      ? '<button type="button" class="resolve-btn shrink-0 bg-[#0f2a6b] text-white text-sm font-semibold rounded-md px-4 py-2 hover:opacity-90" data-id="' + r.id + '">Mark Resolved</button>'
      : '';
    // The student's latest invite (any page). Within 24 hours the server refuses another one, so the button is off until then.
    const inv = r.lastInvite;
    const inviteBtn = !(canInvite && r.studentId) ? ''
      : inv && inv.active
        ? '<button type="button" disabled class="shrink-0 border border-[#0f2a6b] text-[#0f2a6b] text-sm font-semibold rounded-md px-4 py-2 opacity-60 cursor-not-allowed" title="This student already has an active invitation. Update its status on the Student Profile.">' + escapeHtml(inv.statusLabel) + '</button>'
      : inv && inv.recent
        ? '<button type="button" disabled class="shrink-0 border border-[#0f2a6b] text-[#0f2a6b] text-sm font-semibold rounded-md px-4 py-2 opacity-60 cursor-not-allowed" title="Can invite again after ' + formatDate(inv.againAt) + '">Invited</button>'
        : '<button type="button" class="invite-btn shrink-0 border border-[#0f2a6b] text-[#0f2a6b] text-sm font-semibold rounded-md px-4 py-2 hover:bg-slate-50" data-student-id="' + r.studentId + '" data-name="' + escapeHtml(r.name) + '">' + (inv ? 'Invite Again' : 'Invite to Counseling') + '</button>';
    const inviteLine = r.status === 'open' && inv
      ? '<p class="flex items-center gap-2 text-xs text-slate-500"><svg class="w-4 h-4 shrink-0 text-slate-400" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>' +
          '<span>' + (inv.recent ? 'Invited ' : 'Last invited ') + formatDate(inv.at) + (inv.by ? ' by <span class="font-medium text-slate-700">' + escapeHtml(inv.by) + '</span>' : '') +
          (inv.active ? ' &middot; ' + escapeHtml(inv.statusLabel) : (inv.recent ? ' &middot; can invite again after ' + formatDate(inv.againAt) : '')) + '</span></p>'
      : '';
    // Overdue: shown only from 3 office days of waiting (Monday to Saturday; the office never opens on Sunday).
    const waited = r.status === 'open' ? officeDaysSince(r.sentAt) : 0;
    const waiting = waited >= 3 ? ' &middot; <span class="text-red-700 font-semibold">Waiting ' + waited + ' office days</span>' : '';
    // A resolved request says who resolved it and when, in a line at the bottom beside the buttons.
    const resolvedLine = r.status === 'resolved' && r.resolvedAt
      ? '<p class="flex items-center gap-2 text-xs text-slate-500"><svg class="w-4 h-4 shrink-0 text-green-700" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>' +
          '<span>Resolved' + (r.resolvedBy ? ' by <span class="font-medium text-slate-700">' + escapeHtml(r.resolvedBy) + '</span>' : '') + ' &middot; ' + formatDate(r.resolvedAt) + '</span></p>'
      : '';
    const footLine = resolvedLine || inviteLine;
    const footer = footLine
      ? '<div class="flex items-center justify-between gap-4 flex-wrap border-t border-slate-100 pt-3">' + footLine + ((inviteBtn || resolveBtn) ? '<div class="flex gap-2">' + inviteBtn + resolveBtn + '</div>' : '') + '</div>'
      : ((inviteBtn || resolveBtn) ? '<div class="flex justify-end gap-2">' + inviteBtn + resolveBtn + '</div>' : '');
    return '<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col gap-3">' +
      '<div class="flex items-start justify-between gap-4 flex-wrap">' +
        '<div><h3 class="text-base font-semibold text-slate-900">' + escapeHtml(r.subject) + '</h3>' +
        '<p class="text-xs text-slate-500 mt-0.5">' + escapeHtml(r.name) + (r.strand ? ' (' + escapeHtml(r.strand) + (r.section ? ' ' + escapeHtml(r.section) : '') + ')' : '') + ' &middot; ' + (r.status === 'resolved' ? 'Sent ' : '') + formatDate(r.sentAt) + waiting + '</p></div>' +
        statusBadge +
      '</div>' +
      (r.message === null ? '<p class="text-sm text-slate-500 italic">Not shown to you: your access to counseling history is View Only.</p>' : '<p class="text-sm text-slate-700 leading-relaxed">' + escapeHtml(r.message) + '</p>') +
      footer +
    '</div>';
  }

  // ---- Two views: students' messages to the Guidance Office, and requests to retake the assessment.
  // Tabs use the shared filter-tab style (css/components.css); aria-pressed marks the chosen one.
  function renderTabs(counts) {
    document.querySelectorAll('.view-tab').forEach(btn => {
      btn.setAttribute('aria-pressed', btn.dataset.view === view ? 'true' : 'false');
    });
    const tabs = view === 'retakes'
      ? [['pending', 'Pending' + (counts && counts.pending !== undefined ? ' (' + counts.pending + ')' : '')], ['approved', 'Approved'], ['declined', 'Declined'], ['completed', 'Retaken'], ['all', 'All']]
      : [['open', 'Open' + (counts && counts.open !== undefined ? ' (' + counts.open + ')' : '')], ['resolved', 'Resolved'], ['all', 'All']];
    const active = view === 'retakes' ? retakeStatus : activeStatus;
    document.getElementById('statusTabs').innerHTML = tabs.map(function(tb) {
      return '<button type="button" data-status="' + tb[0] + '" aria-pressed="' + (tb[0] === active ? 'true' : 'false') + '" class="status-tab pp-filter-tab">' + tb[1] + '</button>';
    }).join('');
    document.querySelectorAll('.status-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        if (view === 'retakes') retakeStatus = btn.dataset.status; else activeStatus = btn.dataset.status;
        load();
      });
    });
  }
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => { view = btn.dataset.view; load(); });
  });

  function renderRetakeCard(r) {
    const badge = {
      pending: PP.badge('Waiting for an answer', 'amber'),
      approved: PP.badge('Approved', 'green'),
      declined: PP.badge('Declined', 'gray'),
      completed: PP.badge('Retaken', 'green')
    }[r.status] || '';
    const answered = r.status !== 'pending' && r.decidedAt
      ? '<p class="text-xs text-slate-500">Answered ' + formatDate(r.decidedAt) + (r.note ? ' &middot; Note: ' + escapeHtml(r.note) : '') + '</p>'
      : '';
    const actions = r.status === 'pending' && canInvite
      ? '<div class="flex flex-col gap-2">' +
          '<input type="text" maxlength="300" placeholder="Note to the student (optional)" class="retake-note w-full border border-slate-300 rounded-md px-3 py-2 text-sm" data-id="' + r.id + '">' +
          '<div class="flex justify-end gap-2">' +
            '<button type="button" class="retake-decide border border-slate-300 text-slate-600 text-sm font-semibold rounded-md px-4 py-2 hover:bg-slate-50" data-decision="decline" data-id="' + r.id + '">Decline</button>' +
            '<button type="button" class="retake-decide bg-[#0f2a6b] text-white text-sm font-semibold rounded-md px-4 py-2 hover:opacity-90" data-decision="approve" data-id="' + r.id + '">Approve Retake</button>' +
          '</div></div>'
      : '';
    return '<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 flex flex-col gap-3">' +
      '<div class="flex items-start justify-between gap-4 flex-wrap">' +
        '<div><h3 class="text-base font-semibold text-slate-900">' + escapeHtml(r.name) + '</h3>' +
        '<p class="text-xs text-slate-500 mt-0.5">' + escapeHtml(r.strand) + (r.section ? ' ' + escapeHtml(r.section) : '') + ' &middot; Asked ' + formatDate(r.requestedAt) + ' &middot; Result on record: attempt #' + r.attemptNumber + '</p></div>' +
        badge +
      '</div>' +
      (r.reason === null ? '<p class="text-sm text-slate-500 italic">Not shown to you: your access to counseling history is View Only.</p>' : '<p class="text-sm text-slate-700 leading-relaxed">' + escapeHtml(r.reason) + '</p>') +
      answered + actions +
    '</div>';
  }

  async function loadRetakes() {
    const list = document.getElementById('requestsList');
    PP.showSkeleton(list, PP.skeleton.cards(3));
    let data;
    try {
      data = await getList('api/retake-requests.php?status=' + encodeURIComponent(retakeStatus));
    } catch (e) {
      if (e.cancelled) return; // a newer tab click replaced this one
      if (e.status === 403) {
        list.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">You do not have access to retake requests.</p>';
        renderTabs({});
      } else {
        PP.showError(list, e.message, loadRetakes);
      }
      return;
    }
    list.removeAttribute('aria-busy');
    document.getElementById('retakeCount').textContent = data.pendingCount ? '(' + data.pendingCount + ')' : '';
    renderTabs({ pending: data.pendingCount });
    list.innerHTML = data.requests.length
      ? data.requests.map(renderRetakeCard).join('')
      : '<p class="text-sm text-slate-500 text-center py-8">No requests in this view.</p>';
    list.querySelectorAll('.retake-decide').forEach(btn => {
      btn.addEventListener('click', async function() {
        const approve = btn.dataset.decision === 'approve';
        if (!(await PP.confirm(approve ? 'The student can retake the assessment once. Their earlier result stays on record.' : '', { title: approve ? 'Approve this retake?' : 'Decline this retake request?', okLabel: approve ? 'Approve' : 'Decline' }))) return;
        const note = (list.querySelector('.retake-note[data-id="' + btn.dataset.id + '"]') || {}).value || '';
        btn.disabled = true;
        try {
          const r = await fetch('api/retake-requests.php', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'decide', id: Number(btn.dataset.id), decision: btn.dataset.decision, note: note })
          });
          const result = await r.json();
          if (!result.success) { showToast(result.error || 'Could not save your answer.', true); btn.disabled = false; return; }
          showToast(approve ? 'Retake approved. The student was notified' + (result.emailSent ? ' by email and notification.' : '.') : 'Request declined. The student was notified' + (result.emailSent ? ' by email and notification.' : '.'), false);
          await load();
        } catch (e) {
          showToast('Unable to reach the server. Please try again.', true);
          btn.disabled = false;
        }
      });
    });
  }

  async function load() {
    saveState();
    if (view === 'retakes') { await loadRetakes(); return; }
    const list = document.getElementById('requestsList');
    PP.showSkeleton(list, PP.skeleton.cards(3));

    let data;
    try {
      data = await getList('api/help-requests.php?status=' + encodeURIComponent(activeStatus));
    } catch (e) {
      if (e.cancelled) return; // a newer tab click replaced this one
      PP.showError(list, e.message, load);
      return;
    }
    list.removeAttribute('aria-busy');
    renderTabs({ open: data.openCount });
    fetch('api/retake-requests.php?status=pending').then(r => r.ok ? r.json() : null).then(d => { if (d) document.getElementById('retakeCount').textContent = d.pendingCount ? '(' + d.pendingCount + ')' : ''; }).catch(() => {});

    list.innerHTML = data.requests.length
      ? data.requests.map(renderCard).join('')
      : '<p class="text-sm text-slate-500 text-center py-8">No requests in this view.</p>';

    list.querySelectorAll('.invite-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        if (!(await PP.confirm(btn.dataset.name + ' will be sent the CGC booking link by email and in their notifications.', { title: 'Invite to a counseling session?', okLabel: 'Send invitation' }))) return;
        btn.disabled = true;
        try {
          const result = await sendCounselingInvite(btn.dataset.studentId);
          showToast(result.text, !result.ok);
        } catch (e) {
          showToast('Unable to reach the server. Please try again.', true);
        } finally {
          btn.disabled = false;
        }
        await load(); // the card now shows the invite and turns the button off for 24 hours
      });
    });
    list.querySelectorAll('.resolve-btn').forEach(btn => {
      btn.addEventListener('click', async function() {
        // There is no way to reopen a request, so ask first.
        if (!(await PP.confirm('The student gets a notification that it is resolved. It cannot be reopened.', { title: 'Mark this request as resolved?', okLabel: 'Mark Resolved' }))) return;
        btn.disabled = true;
        let res;
        try {
          res = await fetch('api/help-requests.php', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'resolve', id: Number(btn.dataset.id) })
          });
        } catch (e) {
          btn.disabled = false;
          PP.toast('Could not reach the server. Please try again.', true);
          return;
        }
        // 404 is also the answer for a request outside this person's sections (the same answer on purpose), so the
        // message only says the list was out of date.
        if (res.ok) PP.toast('Request marked as resolved.', false);
        else if (res.status === 404) PP.toast('This request is no longer in your list. The list was refreshed.', true);
        else if (res.status === 409) PP.toast('Someone already resolved this request. The list was refreshed.', true);
        else if (res.status === 403) PP.toast('You do not have permission to resolve requests.', true);
        else PP.toast('Could not resolve this request. Please try again.', true);
        await load();
      });
    });
  }

  await load();
})();
</script>

  fetch('api/security-config.php').then(function(r) { return r.json(); }).then(function(data) {

      el.textContent = data.academicYear.current;
    } else {
      document.getElementById('ayBadge').classList.add('hidden');
    }
  }).catch(function() {});
})();
</script>
