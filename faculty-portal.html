<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Portal — Career Profiling System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{ font-family:'Inter', sans-serif; }
</style>
<link rel="stylesheet" href="css/motion.css">
</head>
<body class="bg-[#f8f9fb] min-h-screen">
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="max-w-[600px] mx-auto px-6 pt-8 pb-4 flex items-center justify-center">
  <span class="text-xl font-bold leading-none"><span class="text-[#001c43]">Profile</span><span class="text-[#ed1c24]">Path</span></span>
</header>

<main id="main-content" class="max-w-[600px] mx-auto px-6 pb-16">
  <div class="bg-white border border-black/[0.08] rounded-[20px] p-8 md:p-10">

    <p class="text-xs font-semibold tracking-[1.5px] text-[#495e88] uppercase mb-2">Faculty</p>
    <h1 id="portalHeading" class="text-2xl font-bold text-[#001c43] tracking-tight mb-1">Faculty Portal</h1>
    <p id="portalSubheading" class="text-sm text-[#5c5a5a] mb-8">Enter your Faculty ID and the access code given to you for your assigned session. No login account is needed.</p>

    <!-- Check-in form -->
    <form id="checkinForm" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Faculty ID</label>
        <input type="text" id="facultyCode" required autocomplete="off" class="w-full border border-black/[0.15] rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#0f2a6b]">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Access Code</label>
        <input type="text" id="accessCode" required autocomplete="off" maxlength="12" class="w-full border border-black/[0.15] rounded-md px-4 py-3 text-sm tracking-[3px] text-center uppercase focus:outline-none focus:ring-2 focus:ring-[#0f2a6b]" placeholder="ACCESS CODE">
      </div>
      <p id="checkinError" class="hidden text-sm text-[#ed1c24] bg-red-50 border border-red-100 rounded-md px-3.5 py-2.5" aria-live="polite"></p>
      <button type="submit" id="checkinSubmit" class="bg-[#ed1c24] text-white text-sm font-semibold rounded-md px-5 py-3 hover:opacity-90">Check In</button>
    </form>

    <!-- Session view (shown after a successful check-in) -->
    <div id="sessionView" class="hidden flex-col gap-6">
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
        <p id="sessionDateTime" class="text-sm font-semibold text-[#001c43]"></p>
        <p id="sessionRoomScope" class="text-sm text-slate-600 mt-1"></p>
      </div>
      <div>
        <p class="text-xs font-semibold tracking-wide text-slate-500 uppercase mb-2">Student Roster</p>
        <div class="border border-slate-200 rounded-lg overflow-hidden">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-4 py-2.5 text-xs font-semibold tracking-wide text-slate-500 uppercase">School ID</th>
                <th class="px-4 py-2.5 text-xs font-semibold tracking-wide text-slate-500 uppercase">Name</th>
                <th class="px-4 py-2.5 text-xs font-semibold tracking-wide text-slate-500 uppercase">Assessment</th>
              </tr>
            </thead>
            <tbody id="rosterTbody"></tbody>
          </table>
        </div>
      </div>
      <button type="button" id="newCheckinBtn" class="self-start text-sm font-medium text-[#0f2a6b] hover:underline">Check in to a different session</button>
    </div>

  </div>
</main>

<script src="js/motion.js" defer></script>
<script>
(function() {
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function formatDate(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  }
  function scopeLabel(s) {
    const parts = [];
    parts.push(s.gradeLevel ? 'Grade ' + s.gradeLevel : 'All Grades');
    parts.push(s.strand || 'All Strands');
    parts.push(s.section || 'All Sections');
    return parts.join(' · ');
  }

  const form = document.getElementById('checkinForm');
  const errorEl = document.getElementById('checkinError');
  const sessionView = document.getElementById('sessionView');
  const heading = document.getElementById('portalHeading');
  const subheading = document.getElementById('portalSubheading');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.classList.add('hidden');
    const facultyCode = document.getElementById('facultyCode').value.trim();
    const code = document.getElementById('accessCode').value.trim();
    const submitBtn = document.getElementById('checkinSubmit');
    submitBtn.disabled = true;

    let data;
    try {
      const res = await fetch('api/faculty-verify.php', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ facultyCode, code })
      });
      data = await res.json();
    } catch (err) {
      submitBtn.disabled = false;
      errorEl.textContent = 'Unable to reach the server. Please try again.';
      errorEl.classList.remove('hidden');
      return;
    }
    submitBtn.disabled = false;

    if (!data.success) {
      errorEl.textContent = data.error || 'Invalid Faculty ID or access code.';
      errorEl.classList.remove('hidden');
      return;
    }

    const s = data.schedule;
    document.getElementById('sessionDateTime').textContent = formatDate(s.examDate) + ' · ' + s.startTime + '–' + s.endTime;
    document.getElementById('sessionRoomScope').textContent = 'Room ' + s.room + ' — ' + scopeLabel(s);
    document.getElementById('rosterTbody').innerHTML = data.students.length
      ? data.students.map(function(st) {
          const badge = st.completed
            ? '<span class="bg-green-50 border border-green-100 text-green-700 text-xs font-medium px-2.5 py-1 rounded-full">Completed</span>'
            : '<span class="bg-amber-50 border border-amber-100 text-amber-700 text-xs font-medium px-2.5 py-1 rounded-full">Pending</span>';
          return '<tr class="border-t border-slate-100">' +
            '<td class="px-4 py-2.5 text-sm text-slate-700">' + escapeHtml(st.schoolId) + '</td>' +
            '<td class="px-4 py-2.5 text-sm text-slate-700">' + escapeHtml(st.name) + '</td>' +
            '<td class="px-4 py-2.5">' + badge + '</td>' +
          '</tr>';
        }).join('')
      : '<tr><td colspan="3" class="px-4 py-6 text-center text-sm text-slate-400">No students matched this session yet.</td></tr>';

    heading.textContent = 'Your Assigned Session';
    subheading.textContent = 'Read-only view — refresh this page to see the latest completion status.';
    form.classList.add('hidden');
    sessionView.classList.remove('hidden');
    sessionView.classList.add('flex');
  });

  document.getElementById('newCheckinBtn').addEventListener('click', function() {
    form.reset();
    errorEl.classList.add('hidden');
    heading.textContent = 'Faculty Portal';
    subheading.textContent = 'Enter your Faculty ID and the access code given to you for your assigned session. No login account is needed.';
    sessionView.classList.add('hidden');
    sessionView.classList.remove('flex');
    form.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
